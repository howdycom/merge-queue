name: project-sync tests

on:
  push:
    branches: [main]
    paths:
      - "actions/project-sync/**"
      - ".github/workflows/project-sync-tests.yml"
  pull_request:
    paths:
      - "actions/project-sync/**"
      - ".github/workflows/project-sync-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: actions/project-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: python3 -m pip install pytest coverage

      - name: Run tests with coverage (100% enforced)
        run: |
          coverage run --source=project_sync -m pytest tests -q
          coverage report -m --fail-under=100
