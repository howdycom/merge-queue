name: Merge Queue (reusable)

on:
  workflow_call:
    inputs:
      target_branch:
        description: 'Branch PRs are queued to merge into (e.g. develop).'
        required: true
        type: string
      merge_method:
        description: 'Passed to `gh pr merge --auto` when the dequeue job enables auto-merge.'
        type: string
        default: 'squash'
      ready_label:
        type: string
        default: 'ready to merge'
      processing_label:
        type: string
        default: 'merge-queue: processing'
      requires_action_label:
        type: string
        default: 'requires action'
      tier1_labels:
        description: >
          Ordered comma- or newline-separated labels that focus dequeue
          priority. First label is highest, then the second, and so on.
          Product-specific names belong in the calling repo.
        type: string
        default: 'bug'
      tier1_title_regex:
        type: string
        default: '^\[HOTFIX\]'
      tier2_title_regex:
        type: string
        default: '^\[HCP-'
      deprioritized_title_regex:
        description: >
          Title regex ranked below unlabeled human PRs and above
          Dependabot. Default `[TECH]`.
        type: string
        default: '^\[TECH\]'
      deprioritized_authors:
        description: >
          Comma-separated logins always ranked last (Dependabot by
          default), even when the PR also carries a focus label.
        type: string
        default: 'dependabot,dependabot[bot],app/dependabot'
      stale_after_minutes:
        description: >
          Watchdog budget for a single claim. Past this, failing required
          checks evict; still-pending required checks soft-requeue (keep
          ready label, skip that PR for this pass); otherwise diagnostic
          eviction.
          Successful re-syncs refresh the claim clock, so a PR that keeps
          getting legitimately rebased is not false-evicted mid-CI.
        type: number
        default: 90
      dry_run:
        description: 'Log intended mutations instead of making them. For shadow-mode rollout.'
        type: boolean
        default: false
      runs_on:
        type: string
        default: 'ubuntu-slim'
    secrets:
      # Named merge_queue_pat, not github_token: GitHub reserves the name
      # `github_token` as a system secret and rejects any workflow_call
      # secret declared with that exact name at validation time -- this
      # broke every single run since the reusable workflow was first
      # added, regardless of any other fix, since it's a hard schema
      # validation failure, not a runtime error.
      merge_queue_pat:
        description: >
          Optional. When omitted, jobs use github.token. Grant the caller
          contents: write, pull-requests: write, issues: write, actions: write,
          checks: read, statuses: read, and contents: write. Queue state is a
          JSON file on branch merge-queue-state, which GITHUB_TOKEN can write.
        required: false

concurrency:
  group: merge-queue-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dequeue:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == inputs.ready_label)
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
      statuses: read
    steps:
      - name: Dequeue next PR
        uses: howdycom/workflows/actions/merge-queue@v1
        with:
          command: dequeue
          github_token: ${{ secrets.merge_queue_pat || github.token }}
          target_branch: ${{ inputs.target_branch }}
          merge_method: ${{ inputs.merge_method }}
          ready_label: ${{ inputs.ready_label }}
          processing_label: ${{ inputs.processing_label }}
          requires_action_label: ${{ inputs.requires_action_label }}
          tier1_labels: ${{ inputs.tier1_labels }}
          tier1_title_regex: ${{ inputs.tier1_title_regex }}
          tier2_title_regex: ${{ inputs.tier2_title_regex }}
          deprioritized_title_regex: ${{ inputs.deprioritized_title_regex }}
          deprioritized_authors: ${{ inputs.deprioritized_authors }}
          dry_run: ${{ inputs.dry_run }}

  check-completion:
    # Optional fast path. Callers should not forward every workflow_run
    # (concurrency storms cancel real dequeue/cleanup). Watchdog covers the
    # same work on the schedule tick. This job still runs when a caller does
    # forward a completion for the in-flight SHA.
    if: github.event_name == 'workflow_run'
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
      statuses: read
    steps:
      - name: Check in-flight PR's required checks
        uses: howdycom/workflows/actions/merge-queue@v1
        with:
          command: check-completion
          github_token: ${{ secrets.merge_queue_pat || github.token }}
          target_branch: ${{ inputs.target_branch }}
          merge_method: ${{ inputs.merge_method }}
          ready_label: ${{ inputs.ready_label }}
          processing_label: ${{ inputs.processing_label }}
          requires_action_label: ${{ inputs.requires_action_label }}
          tier1_labels: ${{ inputs.tier1_labels }}
          tier1_title_regex: ${{ inputs.tier1_title_regex }}
          tier2_title_regex: ${{ inputs.tier2_title_regex }}
          deprioritized_title_regex: ${{ inputs.deprioritized_title_regex }}
          deprioritized_authors: ${{ inputs.deprioritized_authors }}
          dry_run: ${{ inputs.dry_run }}

  cleanup:
    if: >
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, inputs.processing_label) &&
      (
        github.event.action == 'closed' ||
        github.event.action == 'synchronize' ||
        (github.event.action == 'unlabeled' && github.event.label.name == inputs.ready_label)
      )
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
      statuses: read
    steps:
      - name: Handle in-flight PR closed / unlabeled / synchronize
        uses: howdycom/workflows/actions/merge-queue@v1
        with:
          command: cleanup
          github_token: ${{ secrets.merge_queue_pat || github.token }}
          target_branch: ${{ inputs.target_branch }}
          merge_method: ${{ inputs.merge_method }}
          ready_label: ${{ inputs.ready_label }}
          processing_label: ${{ inputs.processing_label }}
          requires_action_label: ${{ inputs.requires_action_label }}
          tier1_labels: ${{ inputs.tier1_labels }}
          tier1_title_regex: ${{ inputs.tier1_title_regex }}
          tier2_title_regex: ${{ inputs.tier2_title_regex }}
          deprioritized_title_regex: ${{ inputs.deprioritized_title_regex }}
          deprioritized_authors: ${{ inputs.deprioritized_authors }}
          event_pr_number: ${{ github.event.pull_request.number }}
          event_action: ${{ github.event.action }}
          dry_run: ${{ inputs.dry_run }}

  watchdog:
    if: github.event_name == 'schedule'
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
      statuses: read
    steps:
      - name: Maintain in-flight PR / soft-requeue / evict / idle dequeue
        uses: howdycom/workflows/actions/merge-queue@v1
        with:
          command: watchdog
          github_token: ${{ secrets.merge_queue_pat || github.token }}
          target_branch: ${{ inputs.target_branch }}
          merge_method: ${{ inputs.merge_method }}
          ready_label: ${{ inputs.ready_label }}
          processing_label: ${{ inputs.processing_label }}
          requires_action_label: ${{ inputs.requires_action_label }}
          tier1_labels: ${{ inputs.tier1_labels }}
          tier1_title_regex: ${{ inputs.tier1_title_regex }}
          tier2_title_regex: ${{ inputs.tier2_title_regex }}
          deprioritized_title_regex: ${{ inputs.deprioritized_title_regex }}
          deprioritized_authors: ${{ inputs.deprioritized_authors }}
          stale_after_minutes: ${{ inputs.stale_after_minutes }}
          dry_run: ${{ inputs.dry_run }}
