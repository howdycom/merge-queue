name: Merge Queue (reusable)

on:
  workflow_call:
    inputs:
      target_branch:
        description: 'Branch PRs are queued to merge into (e.g. develop).'
        required: true
        type: string
      merge_method:
        description: 'Passed to `gh pr merge --auto` when the dequeue job enables auto-merge.'
        type: string
        default: 'squash'
      ready_label:
        type: string
        default: 'ready to merge'
      processing_label:
        type: string
        default: 'merge-queue: processing'
      requires_action_label:
        type: string
        default: 'requires action'
      tier1_labels:
        description: 'Comma-separated labels that put a PR in priority tier 1.'
        type: string
        default: 'bug'
      tier1_title_regex:
        type: string
        default: '^\[HOTFIX\]'
      tier2_title_regex:
        type: string
        default: '^\[HCP-'
      stale_after_minutes:
        description: >
          Watchdog budget for a single claim. Past this, failing required
          checks evict; still-pending required checks soft-requeue (keep
          ready label, move to back of tier); otherwise diagnostic eviction.
          Successful re-syncs refresh the claim clock, so a PR that keeps
          getting legitimately rebased is not false-evicted mid-CI.
        type: number
        default: 90
      dry_run:
        description: 'Log intended mutations instead of making them. For shadow-mode rollout.'
        type: boolean
        default: false
      runs_on:
        type: string
        default: 'ubuntu-slim'
    secrets:
      # Named merge_queue_pat, not github_token: GitHub reserves the name
      # `github_token` as a system secret and rejects any workflow_call
      # secret declared with that exact name at validation time -- this
      # broke every single run since the reusable workflow was first
      # added, regardless of any other fix, since it's a hard schema
      # validation failure, not a runtime error.
      merge_queue_pat:
        description: >
          PAT scoped to this repo with Contents (write), Pull requests
          (write), and Variables (read/write) -- GITHUB_TOKEN cannot write
          repo Actions variables, which this design depends on.
        required: true

concurrency:
  group: merge-queue-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dequeue:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == inputs.ready_label)
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: Dequeue next PR
        uses: howdycom/workflows/actions/merge-queue@422bb493665929f92a7f1bfb5903136bb855448d
        with:
          command: dequeue
          github_token: ${{ secrets.merge_queue_pat }}
          target_branch: ${{ inputs.target_branch }}
          merge_method: ${{ inputs.merge_method }}
          ready_label: ${{ inputs.ready_label }}
          processing_label: ${{ inputs.processing_label }}
          requires_action_label: ${{ inputs.requires_action_label }}
          tier1_labels: ${{ inputs.tier1_labels }}
          tier1_title_regex: ${{ inputs.tier1_title_regex }}
          tier2_title_regex: ${{ inputs.tier2_title_regex }}
          dry_run: ${{ inputs.dry_run }}

  check-completion:
    if: >
      github.event_name == 'workflow_run' &&
      vars.MERGE_QUEUE_SHA != '' &&
      github.event.workflow_run.head_sha == vars.MERGE_QUEUE_SHA
    runs-on: ${{ inputs.runs_on }}
    permissions:
      # Fine-grained PATs can't read check-run results created by other Apps
      # via GraphQL, no matter what repository permission is granted --
      # confirmed the hard way (every required check except the one plain
      # commit status failed to resolve, even with Commit statuses: read).
      # The default GITHUB_TOKEN has these out of the box for its own
      # repo/run, so this job's own token is used for the one read-only
      # `gh pr checks --required` query instead -- everything else still
      # goes through the PAT. All three below are actually needed: `gh pr
      # checks`' underlying GraphQL query reads both StatusContext (needs
      # statuses) and CheckRun -> checkSuite -> workflowRun -> workflow
      # (needs actions) branches of the same rollup, not just checks --
      # granting only `checks: read` would still fail on deploy-lock (a
      # plain commit status) or on the workflow-run traversal. Also needs
      # pull-requests: read -- before `gh pr checks` queries the rollup at
      # all, it resolves the PR by number first (Finder.Find/findByNumber),
      # which reads repository.pullRequest { id, number, headRefName } and
      # fails without this if unspecified permissions default to none.
      # Also needs contents: read -- the rollup query itself starts from
      # commits(last: 1) on the PR, which needs read access to the commit/
      # ref data before it can even reach statusCheckRollup; confirmed in
      # production ("Resource not accessible by integration
      # (node.statusCheckRollup.nodes.0)") after granting the four above
      # without it.
      checks: read
      statuses: read
      actions: read
      pull-requests: read
      contents: read
    steps:
      - name: Check in-flight PR's required checks
        uses: howdycom/workflows/actions/merge-queue@422bb493665929f92a7f1bfb5903136bb855448d
        with:
          command: check-completion
          github_token: ${{ secrets.merge_queue_pat }}
          target_branch: ${{ inputs.target_branch }}
          ready_label: ${{ inputs.ready_label }}
          processing_label: ${{ inputs.processing_label }}
          requires_action_label: ${{ inputs.requires_action_label }}
          dry_run: ${{ inputs.dry_run }}

  cleanup:
    if: >
      github.event_name == 'pull_request' &&
      vars.MERGE_QUEUE_PR != '' &&
      format('{0}', github.event.pull_request.number) == vars.MERGE_QUEUE_PR &&
      (
        github.event.action == 'closed' ||
        github.event.action == 'synchronize' ||
        (github.event.action == 'unlabeled' && github.event.label.name == inputs.ready_label)
      )
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: Handle in-flight PR closed / unlabeled / synchronize
        uses: howdycom/workflows/actions/merge-queue@422bb493665929f92a7f1bfb5903136bb855448d
        with:
          command: cleanup
          github_token: ${{ secrets.merge_queue_pat }}
          target_branch: ${{ inputs.target_branch }}
          processing_label: ${{ inputs.processing_label }}
          event_pr_number: ${{ github.event.pull_request.number }}
          event_action: ${{ github.event.action }}
          dry_run: ${{ inputs.dry_run }}

  watchdog:
    if: github.event_name == 'schedule'
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: Maintain in-flight PR / soft-requeue / evict / idle dequeue
        uses: howdycom/workflows/actions/merge-queue@422bb493665929f92a7f1bfb5903136bb855448d
        with:
          command: watchdog
          github_token: ${{ secrets.merge_queue_pat }}
          target_branch: ${{ inputs.target_branch }}
          ready_label: ${{ inputs.ready_label }}
          processing_label: ${{ inputs.processing_label }}
          requires_action_label: ${{ inputs.requires_action_label }}
          stale_after_minutes: ${{ inputs.stale_after_minutes }}
          dry_run: ${{ inputs.dry_run }}
