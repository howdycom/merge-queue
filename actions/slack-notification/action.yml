name: 'Slack Notification'
description: 'Send a status notification (deploy, scheduled job, CI result) to Slack'
inputs:
  status:
    description: 'Run status (success, failure, cancelled)'
    required: true
  environment:
    description: 'Environment name (staging, production)'
    required: true
  workflow_name:
    description: 'Name of the workflow'
    required: true
  commit_sha:
    description: 'Commit SHA'
    required: false
    default: ''
  commit_message:
    description: 'Commit message'
    required: false
    default: ''
  actor:
    description: 'GitHub actor who triggered the workflow'
    required: false
    default: ''
  error_message:
    description: 'Error message if the run failed'
    required: false
    default: ''
  workflow_run_url:
    description: 'URL to the workflow run'
    required: false
    default: ''
  services:
    description: 'Comma-separated list of services affected'
    required: false
    default: ''
  repository:
    description: 'GitHub repository (owner/repo) for commit links'
    required: false
    default: ''
  bot_token:
    description: 'Slack bot token (xoxb-...)'
    required: true
  channel_id:
    description: 'Slack channel ID (C...)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install jq
      shell: bash
      run: |
        if ! command -v jq &> /dev/null; then
          sudo apt-get update -qq && sudo apt-get install -y jq
        fi

    - name: Generate and send Slack notification
      shell: bash
      run: |
        # Determine emoji and title based on status
        case "${{ inputs.status }}" in
          success)
            EMOJI="✅"
            TITLE="Run Successful"
            ;;
          failure)
            EMOJI="❌"
            TITLE="Run Failed"
            ;;
          *)
            EMOJI="⚠️"
            TITLE="Run Cancelled"
            ;;
        esac

        # Truncate strings before passing to jq
        SHORT_SHA=$(echo "${{ inputs.commit_sha }}" | cut -c1-7)
        COMMIT_MSG=$(echo "${{ inputs.commit_message }}" | head -c 100)
        ERROR_MSG=$(echo "${{ inputs.error_message }}" | head -c 1000)

        # Build blocks array using jq for proper JSON construction
        BLOCKS=$(jq -n \
          --arg emoji "$EMOJI" \
          --arg title "$TITLE" \
          --arg env "${{ inputs.environment }}" \
          --arg workflow "${{ inputs.workflow_name }}" \
          --arg services "${{ inputs.services }}" \
          --arg commit_sha "${{ inputs.commit_sha }}" \
          --arg short_sha "$SHORT_SHA" \
          --arg commit_msg "$COMMIT_MSG" \
          --arg repository "${{ inputs.repository }}" \
          --arg actor "${{ inputs.actor }}" \
          --arg error_msg "$ERROR_MSG" \
          --arg workflow_url "${{ inputs.workflow_run_url }}" \
          --arg status "${{ inputs.status }}" \
          '
          # Start with header block
          [
            {
              "type": "header",
              "text": {
                "type": "plain_text",
                "text": "\($emoji) \($title)"
              }
            },
            {
              "type": "section",
              "fields": [
                {
                  "type": "mrkdwn",
                  "text": "*Environment:*\n\($env)"
                },
                {
                  "type": "mrkdwn",
                  "text": "*Workflow:*\n\($workflow)"
                }
              ]
            }
          ] +
          # Add services if provided
          (if $services != "" then [{
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": "*Services:*\n\($services)"
            }
          }] else [] end) +
          # Add commit info if provided
          (if $commit_sha != "" then [{
            "type": "section",
            "fields": [
              {
                "type": "mrkdwn",
                "text": (if $repository != "" then "*Commit:*\n<https://github.com/\($repository)/commit/\($commit_sha)|\($short_sha)>" else "*Commit:*\n\($short_sha)" end)
              },
              {
                "type": "mrkdwn",
                "text": "*Message:*\n\($commit_msg)"
              }
            ]
          }] else [] end) +
          # Add actor if provided
          (if $actor != "" then [{
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": "*Triggered by:*\n\($actor)"
            }
          }] else [] end) +
          # Add error message if provided
          (if $error_msg != "" then [{
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": "*Error:*\n```\($error_msg)```"
            }
          }] else [] end) +
          # Add workflow run button if provided
          (if $workflow_url != "" then [{
            "type": "actions",
            "elements": [{
              "type": "button",
              "text": {
                "type": "plain_text",
                "text": "View Workflow Run"
              },
              "url": $workflow_url,
              "style": (if $status == "failure" then "danger" else "primary" end)
            }]
          }] else [] end)
          ')

        # Build final payload with channel using jq
        PAYLOAD=$(jq -n \
          --arg channel "${{ inputs.channel_id }}" \
          --argjson blocks "$BLOCKS" \
          '{
            "channel": $channel,
            "blocks": $blocks
          }')

        # Validate JSON before sending
        if ! echo "$PAYLOAD" | jq empty 2>/dev/null; then
          echo "❌ ERROR: Generated payload is not valid JSON"
          echo "Payload:"
          echo "$PAYLOAD"
          exit 1
        fi

        # Send to Slack using Web API
        BOT_TOKEN="${{ inputs.bot_token }}"
        RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
          -H "Authorization: Bearer ${BOT_TOKEN}" \
          -H 'Content-type: application/json' \
          --data "$PAYLOAD" \
          https://slack.com/api/chat.postMessage)

        HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
        BODY=$(echo "$RESPONSE" | sed '$d')

        if [ "$HTTP_CODE" = "200" ]; then
          # Check if the API call was successful using jq
          OK=$(echo "$BODY" | jq -r '.ok // false')
          if [ "$OK" = "true" ]; then
            echo "✅ Slack notification sent successfully"
          else
            ERROR=$(echo "$BODY" | jq -r '.error // "unknown error"')
            echo "❌ Failed to send Slack notification: ${ERROR}"
            echo "Response body:"
            echo "$BODY" | jq '.' || echo "$BODY"
            exit 1
          fi
        else
          echo "❌ Failed to send Slack notification: HTTP ${HTTP_CODE}"
          echo "Response body:"
          echo "$BODY" | jq '.' || echo "$BODY"
          exit 1
        fi
