name: 'Merge Queue'
description: >
  Runs one step of a merge-queue state machine: dequeue the next ready PR and
  update it against the target branch, check the in-flight PR's completion
  status, clean up after it's closed/unlabeled/pushed-to, or evict it if it's
  been stuck too long. See the design proposal for the full state machine.
inputs:
  command:
    description: 'One of: dequeue | check-completion | cleanup | watchdog'
    required: true
  github_token:
    description: >
      Token used for labels, comments, update-branch, auto-merge, and the
      merge-queue-state JSON file. The job GITHUB_TOKEN is enough when the
      caller grants contents: write, pull-requests: write, issues: write,
      and actions: write. A PAT is optional, not required.
    required: true
  target_branch:
    description: 'Branch PRs are queued to merge into (e.g. develop).'
    required: true
  merge_method:
    description: >
      Passed to `gh pr merge --auto`. The dequeue command enables auto-merge
      itself rather than trusting the PR author already turned it on -- a PR
      that's ready-labeled but never had auto-merge enabled would otherwise
      sit fully green and just never merge, jamming the queue until the
      watchdog evicts a perfectly healthy PR.
    required: false
    default: 'squash'
  ready_label:
    description: 'Human-applied label marking a PR ready to enter the queue.'
    required: false
    default: 'ready to merge'
  processing_label:
    description: 'System-owned label marking the one PR currently in flight.'
    required: false
    default: 'merge-queue: processing'
  requires_action_label:
    description: 'System-owned label applied on eviction.'
    required: false
    default: 'requires action'
  tier1_labels:
    description: >
      Ordered comma- or newline-separated labels that focus dequeue priority.
      First label is highest priority, then the second, and so on. A PR that
      matches several of these uses the earliest match. Product-specific
      names belong in the calling repo — this action does not hardcode them.
    required: false
    default: 'bug'
  tier1_title_regex:
    description: 'Title regex (case-insensitive) that puts a PR in priority tier 1.'
    required: false
    default: '^\[HOTFIX\]'
  tier2_title_regex:
    description: >
      Title regex (case-insensitive) that ranks a PR after every focus
      label and above unlabeled / [TECH] PRs. Default is leftover Jira
      `[HCP-…]` titles; callers with GitHub issues should pass
      `^\[(#\d+|HCP-)` so `[#1234]` ranks here too.
    required: false
    default: '^\[HCP-'
  deprioritized_title_regex:
    description: >
      Title regex (case-insensitive) ranked below unlabeled human PRs
      and above Dependabot. Default `[TECH]`.
    required: false
    default: '^\[TECH\]'
  deprioritized_authors:
    description: >
      Comma- or newline-separated GitHub logins always ranked last,
      even when the PR also carries a focus label. Default Dependabot
      variants (`app/dependabot`, `dependabot[bot]`, `dependabot`).
    required: false
    default: 'dependabot,dependabot[bot],app/dependabot'
  stale_after_minutes:
    description: 'For the watchdog command: evict the in-flight PR if it has been claimed longer than this with no resolution.'
    required: false
    default: '90'
  event_pr_number:
    description: 'For the cleanup command: github.event.pull_request.number from the triggering event.'
    required: false
    default: ''
  event_action:
    description: 'For the cleanup command: github.event.action from the triggering event, used in log messages.'
    required: false
    default: ''
  dry_run:
    description: 'Log intended mutations instead of making them. For shadow-mode rollout.'
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    # Self-hosted light runners may ship a years-old `gh` that lacks fields
    # queue.mjs depends on (e.g. headRefOid, added in gh 2.18; --slurp ~2.48).
    # Prefer the latest GitHub CLI release, but a brand-new cli/cli tag (or a
    # transient GitHub Releases 503) must not fail the queue — retry, then
    # walk back through recent stables and install the first tarball that
    # downloads. No root/sudo: tarball unpacks under $RUNNER_TEMP.
    - name: Ensure latest GitHub CLI
      shell: bash
      env:
        # Unauthenticated rate limit is fine; use job token when present for reliability.
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        current_version() {
          if ! command -v gh >/dev/null 2>&1; then
            echo 'none'
            return
          fi
          # "gh version 2.40.1 (2024-...)" → 2.40.1
          gh --version 2>/dev/null | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo 'none'
        }

        version_ge() {
          # version_ge A B → 0 if A >= B (semver major.minor.patch)
          printf '%s\n%s\n' "$1" "$2" | sort -V | head -1 | grep -qx "$2"
        }

        # Floor for fields queue.mjs uses today (headRefOid, autoMergeRequest, etc.).
        # We still prefer latest; this is the "already good enough" bar when the
        # GitHub Releases CDN will not serve a newer tarball.
        MIN_GH_VERSION='2.48.0'

        BEFORE="$(current_version)"
        echo "Runner gh before: ${BEFORE} ($(command -v gh 2>/dev/null || echo 'not on PATH'))"

        OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
        case "$(uname -m)" in
          x86_64|amd64) ARCH=amd64 ;;
          aarch64|arm64) ARCH=arm64 ;;
          *)
            echo "::error::Unsupported architecture for gh install: $(uname -m)"
            exit 1
            ;;
        esac

        case "$OS" in
          linux)  OS_LABEL=linux ;;
          darwin) OS_LABEL=macOS ;;
          *)
            echo "::error::Unsupported OS for gh install: $OS"
            exit 1
            ;;
        esac

        # Resolve latest stable tag (vX.Y.Z). Prefer gh itself when present; fall back to REST.
        if command -v gh >/dev/null 2>&1; then
          LATEST_TAG="$(gh api repos/cli/cli/releases/latest --jq .tag_name || true)"
        else
          LATEST_TAG="$(curl -fsSL --retry 3 --retry-delay 2 https://api.github.com/repos/cli/cli/releases/latest | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1 || true)"
        fi
        if [[ -z "${LATEST_TAG}" || "${LATEST_TAG}" == null ]]; then
          echo "Could not resolve latest cli/cli release tag; will try the recent-release list."
          LATEST_TAG=''
          LATEST_VERSION=''
        else
          LATEST_VERSION="${LATEST_TAG#v}"
          echo "Latest gh release: ${LATEST_TAG}"
        fi

        if [[ -n "$LATEST_VERSION" && "$BEFORE" != 'none' ]] && version_ge "$BEFORE" "$LATEST_VERSION"; then
          echo "gh ${BEFORE} is already latest; leaving PATH unchanged."
          gh --version
          exit 0
        fi

        download_and_install() {
          local tag="$1"
          local version="${tag#v}"
          local asset="gh_${version}_${OS_LABEL}_${ARCH}.tar.gz"
          local url="https://github.com/cli/cli/releases/download/${tag}/${asset}"
          local dest="${RUNNER_TEMP:-/tmp}/gh-install"
          rm -rf "$dest"
          mkdir -p "$dest"
          echo "Downloading ${url}"
          # --retry already covers HTTP 503. Do not use --retry-all-errors:
          # older runner curl (7.68 on Ubuntu 20.04) does not have that flag.
          if ! curl -fL --retry 5 --retry-delay 2 --connect-timeout 15 \
              -o "${dest}/${asset}" "$url"; then
            echo "Download failed for ${tag}; will try an older release if available."
            return 1
          fi
          if ! tar -xzf "${dest}/${asset}" -C "$dest"; then
            echo "Extract failed for ${tag}; will try an older release if available."
            return 1
          fi
          local bin_dir="${dest}/gh_${version}_${OS_LABEL}_${ARCH}/bin"
          if [[ ! -x "${bin_dir}/gh" ]]; then
            echo "Extracted gh binary missing at ${bin_dir}/gh"
            return 1
          fi
          echo "${bin_dir}" >> "$GITHUB_PATH"
          export PATH="${bin_dir}:${PATH}"
          return 0
        }

        list_release_tags() {
          local tags=''
          if command -v gh >/dev/null 2>&1; then
            tags="$(gh api 'repos/cli/cli/releases?per_page=8' --jq '.[] | select(.prerelease==false and .draft==false) | .tag_name' 2>/dev/null || true)"
          fi
          if [[ -z "$tags" ]]; then
            tags="$(curl -fsSL --retry 3 --retry-delay 2 'https://api.github.com/repos/cli/cli/releases?per_page=8' \
              | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' || true)"
          fi
          if [[ -n "$LATEST_TAG" ]]; then
            printf '%s\n%s\n' "$LATEST_TAG" "$tags" | awk 'NF && !seen[$0]++'
          else
            printf '%s\n' "$tags" | awk 'NF && !seen[$0]++'
          fi
        }

        INSTALLED=0
        while IFS= read -r tag; do
          [[ -z "$tag" ]] && continue
          if download_and_install "$tag"; then
            INSTALLED=1
            break
          fi
        done < <(list_release_tags)

        AFTER="$(current_version)"
        echo "Runner gh after: ${AFTER} ($(command -v gh 2>/dev/null || echo 'not on PATH'))"
        if command -v gh >/dev/null 2>&1; then
          gh --version
        fi

        if [[ "$AFTER" != 'none' ]] && version_ge "$AFTER" "$MIN_GH_VERSION"; then
          if [[ "$INSTALLED" -eq 0 ]]; then
            echo "::warning::Could not download a newer gh; continuing with runner gh ${AFTER}."
          fi
          exit 0
        fi

        echo "::error::Could not install gh >= ${MIN_GH_VERSION} (have ${AFTER}). GitHub Releases download failed and the runner binary is too old."
        exit 1

    - name: Run merge-queue command
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        MQ_GITHUB_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        MQ_COMMAND: ${{ inputs.command }}
        MQ_TARGET_BRANCH: ${{ inputs.target_branch }}
        MQ_MERGE_METHOD: ${{ inputs.merge_method }}
        MQ_READY_LABEL: ${{ inputs.ready_label }}
        MQ_PROCESSING_LABEL: ${{ inputs.processing_label }}
        MQ_REQUIRES_ACTION_LABEL: ${{ inputs.requires_action_label }}
        MQ_TIER1_LABELS: ${{ inputs.tier1_labels }}
        MQ_TIER1_TITLE_REGEX: ${{ inputs.tier1_title_regex }}
        MQ_TIER2_TITLE_REGEX: ${{ inputs.tier2_title_regex }}
        MQ_DEPRIORITIZED_TITLE_REGEX: ${{ inputs.deprioritized_title_regex }}
        MQ_DEPRIORITIZED_AUTHORS: ${{ inputs.deprioritized_authors }}
        MQ_STALE_AFTER_MINUTES: ${{ inputs.stale_after_minutes }}
        MQ_EVENT_PR_NUMBER: ${{ inputs.event_pr_number }}
        MQ_EVENT_ACTION: ${{ inputs.event_action }}
        MQ_DRY_RUN: ${{ inputs.dry_run }}
      run: node "${{ github.action_path }}/queue.mjs"
